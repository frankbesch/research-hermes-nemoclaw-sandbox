version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /opt/hermes
    - /proc
    - /dev/urandom
    - /app
    - /run/nemoclaw/managed-gateway-expected-exit
    - /etc
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/pts
    - /sandbox/.hermes
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  brew-balanced:
    name: brew-balanced
    endpoints:
      - host: formulae.brew.sh
        port: 443
        tls: skip
        access: full
      - host: github.com
        port: 443
        access: full
      - host: ghcr.io
        port: 443
        tls: skip
        access: full
      - host: pkg-containers.githubusercontent.com
        port: 443
        tls: skip
        access: full
      - host: objects.githubusercontent.com
        port: 443
        tls: skip
        access: full
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: HEAD
              path: /**
    binaries:
      - path: /usr/bin/curl
      - path: /usr/local/bin/brew
      - path: /home/linuxbrew/.linuxbrew/bin/brew
      - path: /home/linuxbrew/.linuxbrew/bin/*
      - path: /home/linuxbrew/.linuxbrew/Homebrew/bin/*
  huggingface:
    name: huggingface
    endpoints:
      - host: huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
      - host: cdn-lfs.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
      - host: router.huggingface.co
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: POST
              path: /**
    binaries:
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/node
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: POST
              path: /v1/messages
          - allow:
              method: POST
              path: /v1/responses
          - allow:
              method: POST
              path: /v1/completions
          - allow:
              method: POST
              path: /v1/embeddings
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: GET
              path: /v1/models/**
    binaries:
      - path: /usr/local/bin/hermes
      - path: /usr/bin/python3.11
      - path: /opt/hermes/.venv/bin/python
  native_nvidia_inference:
    name: native_nvidia_inference
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - path: /usr/local/bin/node
      - path: /usr/bin/node
      - path: /opt/hermes/.venv/bin/python
      - path: /opt/hermes/.venv/bin/python3
      - path: /opt/venv/bin/python3
      - path: /usr/local/bin/curl
      - path: /usr/bin/curl
  nous_research:
    name: nous_research
    endpoints:
      - host: nousresearch.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: POST
              path: /**
      - host: hermes-agent.nousresearch.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
          - allow:
              method: POST
              path: /**
    binaries:
      - path: /usr/local/bin/hermes
      - path: /usr/bin/python3*
      - path: /opt/hermes/.venv/bin/python
  npm_yarn:
    name: npm_yarn
    endpoints:
      - host: registry.npmjs.org
        port: 443
        tls: skip
        access: full
      - host: registry.yarnpkg.com
        port: 443
        tls: skip
        access: full
    binaries:
      - path: /usr/local/bin/npm*
      - path: /usr/local/bin/npx*
      - path: /usr/local/bin/node*
      - path: /usr/local/bin/yarn*
      - path: /usr/bin/npm*
      - path: /usr/bin/node*
  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: POST
              path: /v1/completions
          - allow:
              method: POST
              path: /v1/embeddings
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: GET
              path: /v1/models/**
    binaries:
      - path: /usr/local/bin/hermes
      - path: /usr/bin/python3*
      - path: /opt/hermes/.venv/bin/python
  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /**
    binaries:
      - path: /usr/bin/curl
      - path: /usr/local/bin/pip3
      - path: /usr/local/bin/curl
      - path: /usr/bin/python3*
      - path: /opt/hermes/.venv/bin/python
