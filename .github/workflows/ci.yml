name: CI
# Offline checks only: no runtime, no key, no model calls.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and lint
        run: |
          for f in harness/*.sh harness/fixtures/*.sh; do bash -n "$f"; done
          sh -n harness/probe.sh
          shellcheck -S warning harness/*.sh harness/fixtures/*.sh
          python3 -m py_compile harness/canary_listener.py
      - name: Round-2 dry run (no Docker, model, or network)
        run: |
          out=$(bash harness/batch.sh --round2 --dry-run)
          echo "$out" | tail -n 1 | grep -qx 'ROUND2 DONE'
          test "$(echo "$out" | grep -c '^CELL')" = 132
      - name: Round-2 real-mode self-test (stub tools; no Docker, model, or network)
        run: bash harness/selftest.sh
      - name: Run-status classifier on the round-2 logs
        run: bash harness/test-status.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          V: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
          tgz="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tgz}"
          curl -sSfL "${base}/gitleaks_${V}_checksums.txt" -o sums.txt
          grep " ${tgz}\$" sums.txt | sha256sum -c -
          tar -xzf "${tgz}" gitleaks
      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
